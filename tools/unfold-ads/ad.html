<!doctype html>
<html><head><meta charset="utf-8">
<!-- Unfold-Werbung (Vivien, 25.10.2026): ?m=1|2|3 Motiv, f=feed|story, l=de|en. Per Playwright gerendert. -->
<style>
@font-face{font-family:"Cormorant";font-weight:300 700;src:url(../../fonts/CormorantGaramond-VF.woff) format("woff")}
@font-face{font-family:"Cormorant";font-weight:300 700;font-style:italic;src:url(../../fonts/CormorantGaramond-Italic-VF.woff) format("woff")}
@font-face{font-family:"Hanken";font-weight:300 700;src:url(../../fonts/HankenGrotesk-VF.woff) format("woff")}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;overflow:hidden;background:#F2ECE4;color:#2E2529;font-family:Hanken,sans-serif;position:relative}
body.story{height:1920px}
.ph{position:absolute;inset:0;z-index:0;background-size:cover;background-position:50% 40%}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(242,236,228,0) 30%,rgba(242,236,228,.82) 62%,#F2ECE4 82%)}
.wrap{position:absolute;inset:0;z-index:1;padding:84px 84px 90px;display:flex;flex-direction:column}
.story .wrap{padding:170px 90px 230px}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px;font-family:Cormorant,serif;font-size:46px}
.brand img{width:46px}.brand i{display:inline-block;width:12px;height:12px;border-radius:50%;background:#7D5E68}
.pill{font-size:24px;letter-spacing:.16em;text-transform:uppercase;background:#4A3A41;color:#F2ECE4;border-radius:99px;padding:14px 26px}
.k{font-size:26px;letter-spacing:.22em;text-transform:uppercase;color:#7D5E68}
h1{font-family:Cormorant,serif;font-weight:500;font-size:190px;line-height:.9;letter-spacing:.01em;margin-top:18px}
.sub{font-family:Cormorant,serif;font-style:italic;font-size:62px;color:#7D5E68;margin-top:10px}
.lead{font-size:34px;line-height:1.4;margin-top:28px;max-width:860px}
.facts{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
.facts span{background:#FBF8F4;border:1px solid #DDD2C6;border-radius:99px;padding:14px 26px;font-size:28px}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:30px}
.url{font-size:30px;color:#4A3A41}.url b{display:block;font-family:Cormorant,serif;font-weight:500;font-size:48px}
.btn{background:#7D5E68;color:#FBF5F7;border-radius:99px;padding:24px 40px;font-size:30px;white-space:nowrap}
.blob{position:absolute;border-radius:62% 38% 46% 54%/55% 45% 55% 45%}
/* Motiv 2: dunkel */
body.m2{background:#4A3A41;color:#FBF5F7}
.m2 .k{color:#E8D6CA}.m2 .brand{color:#FBF5F7}.m2 .url{color:#EADFDE}.m2 .btn{background:#E8D6CA;color:#4A3A41}
.q{font-family:Cormorant,serif;font-size:96px;line-height:1.02;margin-top:40px}
.q em{color:#E8D6CA}
.list{margin-top:46px;display:grid;gap:22px}
.list div{font-size:34px;line-height:1.35;padding-left:46px;position:relative;color:#EADFDE}
.list div::before{content:"";position:absolute;left:0;top:14px;width:18px;height:18px;border-radius:50%;background:#E8D6CA}
.ans{margin-top:56px;padding-top:40px;border-top:1px solid rgba(232,214,202,.35)}
.ans p{font-family:Cormorant,serif;font-style:italic;font-size:70px;color:#E8D6CA;line-height:1.1}
/* Motiv 3: Säulen */
.pil{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:40px}
.pil div{background:#FBF8F4;border-radius:32px;padding:30px}
.pil b{display:block;font-family:Cormorant,serif;font-weight:500;font-size:46px;margin:8px 0 6px}
.pil p{font-size:26px;line-height:1.35;color:#7D7076}
.pil span{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#E8D6CA;font-family:Cormorant,serif;font-size:30px}
.price{display:flex;align-items:baseline;gap:22px;margin-top:36px;font-family:Cormorant,serif}
.price b{font-size:110px;font-weight:400;line-height:1}.price span{font-family:Hanken;font-size:30px;color:#7D7076}
.m1 h1{font-size:150px}.story.m1 h1{font-size:180px}.m1 .ph{bottom:auto;height:40%;background-position:50% 35%}.m1 .ph::after{background:linear-gradient(180deg,rgba(245,233,223,0) 70%,#F5E9DF 100%)}.story.m1 .ph{height:50%}
/* dezent wärmer (Vivien, 25.10.2026) */
.m1 .k{display:inline-block;position:relative;z-index:3;background:rgba(252,246,240,.94);color:#6B5658;padding:12px 24px;border-radius:99px;font-weight:500}
body.m1{background:#F5E9DF}.m1 .ph::before{content:"";position:absolute;inset:0;background:rgba(214,160,122,.17);mix-blend-mode:multiply;z-index:1}.m1 .ph::after{z-index:2}.m1 .facts span{background:#FCF6F0;border-color:#E6D3C4}
.m3 .price{margin-bottom:30px}
.m1 .foot{margin-top:70px}
.story h1{font-size:210px}.story .q{font-size:108px}.story .pil{grid-template-columns:1fr;gap:16px}.story .pil div{padding:26px 30px}
</style></head>
<body>
<script>
const P=new URLSearchParams(location.search), m=P.get('m')||'1', f=P.get('f')||'feed', l=P.get('l')||'de', de=l==='de';
document.body.classList.add(f,'m'+m);
const T=(a,b)=>de?a:b;
const brand=`<div class="top"><div class="brand"><img src="../../img/movecia/movecia-zeichen-klein.svg"><span>Movecia<i></i></span></div><span class="pill">${T('Nur 10 Plätze','Only 10 spots')}</span></div>`;
const foot=`<div class="foot"><div class="url">${T('Jetzt buchen','Book now')}<b>moveciamovement.com/unfold</b></div><span class="btn">${T('Link in Bio','Link in bio')} →</span></div>`;
let h='';
if(m==='1'){
 h=`<div class="ph" style="background-image:url(../../img/movecia/fotos/art-reach.jpg)"></div><div class="wrap">${brand}
 <div style="margin-top:auto"><p class="k">${T('3 Monate Begleitung · live online','3 months of guidance · live online')}</p>
 <h1>Unfold</h1><p class="sub">The Mindful Becoming</p>
 <p class="lead">${T('Dein 3-Monats-Begleiter für Mindful Movement. Denn Bewegung beginnt bei dir.','Your 3-month companion for mindful movement. Because movement begins with you.')}</p>
 <div class="facts"><span>${T('Start 10. Jänner','Starts 10 January')}</span><span>${T('wöchentlicher Live-Call','weekly live call')}</span><span>${T('2 Videos pro Woche','2 videos a week')}</span><span>Deutsch &amp; English</span></div></div>
 <div style="height:50px"></div>${foot}</div>`;
}
if(m==='2'){
 h=`<span class="blob" style="width:520px;height:480px;right:-160px;top:-120px;background:rgba(232,214,202,.12)"></span><div class="wrap">${brand.replace('movecia-zeichen-klein','movecia-zeichen-hell')}
 <p class="k" style="margin-top:80px">${T('Kennst du das?','Sound familiar?')}</p>
 <p class="q">${T('Du funktionierst.<br><em>Aber wo bist du?</em>','You keep going.<br><em>But where are you?</em>')}</p>
 <div class="list"><div>${T('Dein Kopf ist voll mit Listen und den Bedürfnissen aller anderen.','Your head is full of lists and everyone else\'s needs.')}</div><div>${T('Bewegung soll guttun, fühlt sich aber nach noch mehr Leistung an.','Movement should feel good, but feels like more pressure.')}</div><div>${T('Du spürst, dass mehr in dir steckt, und weißt nicht, wo anfangen.','You feel there is more inside you and don\'t know where to begin.')}</div></div>
 <div class="ans"><p>${T('Unfold. Drei Monate, um zu dir zurückzufinden.','Unfold. Three months to come back to yourself.')}</p></div>
 ${foot}</div>`;
}
if(m==='3'){
 h=`<span class="blob" style="width:560px;height:520px;right:-200px;top:-160px;background:#EADFDE"></span><div class="wrap">${brand}
 <p class="k" style="margin-top:60px">${T('Das ist dabei','What\'s included')}</p>
 <p class="q" style="font-size:${f==='story'?100:84}px;margin-top:16px">${T('Bewegung für den Körper,<br><em style="color:#7D5E68">Impulse für den Kopf.</em>','Movement for your body,<br><em style="color:#7D5E68">tools for your mind.</em>')}</p>
 <div class="pil">
  <div><span>1</span><b>${T('Bewegung','Movement')}</b><p>${T('2 Videos pro Woche: Yoga, Bodyweight, Somatic, Movement','2 videos a week: yoga, bodyweight, somatic, movement')}</p></div>
  <div><span>2</span><b>${T('Live-Call','Live call')}</b><p>${T('jede Woche mit Impulsvortrag, auf Deutsch oder Englisch','every week with a talk, in English or German')}</p></div>
  <div><span>3</span><b>Workbooks</b><p>${T('Mental Load, Organisation, Selbstwert, deine Ideen','mental load, organisation, self-worth, your ideas')}</p></div>
  <div><span>4</span><b>${T('Rituale','Rituals')}</b><p>${T('Journaling, Meditation und Breathwork','journaling, meditation and breathwork')}</p></div></div>
 <div class="price"><b>€ 450</b><span>${T('oder 3 × € 160 · Start 10. Jänner','or 3 × € 160 · starts 10 January')}</span></div>
 ${foot}</div>`;
}
document.body.insertAdjacentHTML('beforeend',h);
</script>
</body></html>
